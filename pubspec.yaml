name: table_note
description: Genel amaçlı tablo not alma uygulaması

version: 2.0.0+11

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  app_links: ^7.2.1
  crypto: ^3.0.6
  csv: ^8.0.0
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.3
  in_app_purchase_storekit: ^0.4.11+2
  path_provider: ^2.1.5
  pdf: ^3.11.3
  provider: ^6.0.5
  share_plus: ^10.1.4
  shared_preferences: ^2.2.2
  sign_in_with_apple: ^8.2.0
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.2
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  http: ^1.2.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
  
  assets:
    - assets/fonts/
